<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EACCo - Login</title>
    {% load static %}
    <link rel="stylesheet" href="{% static "css/login.css" %}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="branding">
                <div class="logo">EACCo</div>
                <div class="brand-name">Erfaan Amanzai Construction Co.</div>
                <div class="brand-sub">Financial Management System</div>
            </div>
            <form method="post" novalidate>
                {% csrf_token %}
                {% if form.errors %}
                <div class="error-message">Invalid username or password. Please try again.</div>
                {% endif %}
                <div class="input-group">
                    <label for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" autofocus required>
                </div>
                <div class="input-group">
                    <label for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" required>
                </div>
                <button type="submit" class="btn-login">Log In</button>
            </form>
            <div class="footer-note">© 2026 EACCo - Secure Access</div>
        </div>
    </div>
</body>
</html>
