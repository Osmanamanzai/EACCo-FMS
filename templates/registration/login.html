<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EACCo - Login</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-page">
        <!-- Floating background shapes (decorative) -->
        <div class="bg-shapes">
            <span></span><span></span><span></span><span></span>
        </div>

        <!-- Centered Login Card (glassmorphism) -->
        <div class="login-card">
            <div class="login-branding">
                <div class="logo">EACCo</div>
                <p class="brand-name">Erfaan Amanzai Construction Co.</p>
                <p class="brand-sub">Financial Management System</p>
            </div>
            <form method="post" novalidate>
                {% csrf_token %}
                {% if form.errors %}
                <div class="error-message">Invalid username or password</div>
                {% endif %}
                <div class="input-group">
                    <label for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" placeholder="Enter username" autofocus required>
                </div>
                <div class="input-group">
                    <label for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-login">
                    <span>Log In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>

        <!-- Welcome banner at the bottom -->
        <div class="welcome-banner">
            <div class="welcome-line"></div>
            <h2>Welcome to <span>Erfaan Amanzai Construction Company</span></h2>
            <p class="welcome-tagline">Building the Future, with Precision &amp; Trust</p>
        </div>
    </div>
</body>
</html>
