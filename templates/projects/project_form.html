{% extends 'base.html' %}
{% block title %}{{ title }} - EACCo{% endblock %}
{% block content %}
<div class="panel" style="max-width:600px; margin: 0 auto;">
    <div class="panel-header"><span class="panel-dot"></span> {{ title }}</div>

    {% if form.errors %}
        <div class="alert alert-error">
            Please correct the errors below.
        </div>
    {% endif %}

    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'project_list' %}" class="btn btn-secondary" style="margin-left:8px;">Cancel</a>
    </form>
</div>
{% endblock %}
