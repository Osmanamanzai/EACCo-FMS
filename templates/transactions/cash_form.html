{% extends 'base.html' %}
{% block title %}{{ title }} - EACCo{% endblock %}
{% block content %}
<div class="panel" style="max-width:600px; margin: 0 auto;">
    <div class="panel-header"><span class="panel-dot"></span> {{ title }}</div>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% if cancel_url %}{{ cancel_url }}{% elif 'cash-in' in request.path %}{% url 'cash_in_list' %}{% else %}{% url 'cash_out_list' %}{% endif %}" class="btn btn-secondary" style="margin-left:8px;">Cancel</a>
    </form>
</div>
{% endblock %}
