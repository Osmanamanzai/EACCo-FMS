{% extends 'base.html' %}
{% block title %}Add Expense - EACCo{% endblock %}
{% block content %}
<div class="panel" style="max-width:600px; margin: 0 auto;">
    <div class="panel-header"><span class="panel-dot"></span> Add New Expense</div>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save Expense</button>
        <a href="{% url 'expense_list' %}" class="btn btn-secondary" style="margin-left:8px;">Cancel</a>
    </form>
</div>
{% endblock %}
